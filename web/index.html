<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="csp-nonce" content="__NONCE__">
<title>zedcode</title>
<script src="/static/theme.js?v=__V__"></script>
<link rel="stylesheet" href="/static/style.css?v=__V__">
<script src="/static/editor.js?v=__V__" defer></script>
<script src="/static/app.js?v=__V__" defer></script>
</head>
<body>
<header class="bar">
  <div class="group">
    <a class="brand" href="/" title="Nouvelle salle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
      zedcode
    </a>
    <button id="room" class="chip" type="button" title="Copier le lien de la salle">
      <span id="room-code">······</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
    </button>
    <span class="presence" aria-live="polite">
      <span id="dot" class="dot"></span>
      <span id="status">connexion…</span>
      <span id="peers" class="peers"></span>
    </span>
  </div>

  <div class="group">
    <select id="lang" class="select" aria-label="Langage" title="Langage (coloration syntaxique)"></select>
    <form id="join" class="join">
      <input id="join-code" maxlength="6" pattern="[A-Za-z0-9]{6}" placeholder="Code"
             aria-label="Code de salle à rejoindre" autocomplete="off" spellcheck="false" required>
      <button class="btn icon" type="submit" title="Rejoindre la salle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <button id="btn-download" class="btn" type="button" title="Télécharger le contenu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span class="label">Télécharger</span>
    </button>
    <a class="btn primary" href="/" title="Créer une salle vide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">Nouvelle salle</span>
    </a>
    <button id="btn-theme" class="btn icon" type="button" title="Thème clair / sombre" aria-label="Basculer le thème clair / sombre">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
  </div>
</header>

<main id="editor"></main>

<footer>Salle effacée 2 h après la dernière activité · rien n'est écrit sur disque · quiconque a le code peut lire : pas de secrets ici.</footer>
</body>
</html>
