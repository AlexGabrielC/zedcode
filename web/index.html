<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>zedcode</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/" title="Nouvelle salle">zedcode</a>
  <span id="room" class="room"></span>
  <span id="status" class="status"></span>
  <span id="peers" class="peers"></span>
  <nav>
    <form id="join" class="join">
      <input id="join-code" maxlength="6" pattern="[A-Za-z0-9]{6}" placeholder="code"
             aria-label="Code de salle à rejoindre" autocomplete="off" spellcheck="false" required>
      <button type="submit">Rejoindre</button>
    </form>
    <a class="button" href="/">Nouvelle salle</a>
    <button id="btn-copy" type="button">Copier le lien</button>
    <button id="btn-download" type="button">Télécharger</button>
  </nav>
</header>
<main>
  <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off"
            aria-label="Éditeur de code" placeholder="Colle ou tape ton code ici…"></textarea>
</main>
<footer>Salle effacée 2 h après la dernière activité. Rien n'est écrit sur disque. Quiconque a le code peut lire : pas de secrets ici.</footer>
</body>
</html>
