services:
  zedcode:
    build: .
    restart: unless-stopped
    # Pas de "ports:" : le proxy de Coolify (Traefik/Caddy) route vers 8080
    # via le champ Domains = https://code.zedxp.com:8080
    expose:
      - "8080"
    environment:
      # Le conteneur n'est joignable que via le proxy : on peut lire l'IP
      # client dans X-Forwarded-For (pour la limite de débit par IP).
      TRUST_PROXY: "1"
      ROOM_TTL: ${ROOM_TTL:-2h}
      JOIN_PER_MINUTE: ${JOIN_PER_MINUTE:-30}
      MAX_DOC_BYTES: ${MAX_DOC_BYTES:-1048576}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-262144000}
      MAX_FILES_PER_ROOM: ${MAX_FILES_PER_ROOM:-3}
      # Textes + fichiers, tout en RAM. À garder sous GOMEMLIMIT (280MiB, Dockerfile),
      # lui-même sous la limite du conteneur (320M) : marge pour le runtime Go.
      MAX_TOTAL_BYTES: ${MAX_TOTAL_BYTES:-268435456}
    # Aucun volume : tout vit en RAM, rien ne finit dans une sauvegarde.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/zedcode", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 320M
